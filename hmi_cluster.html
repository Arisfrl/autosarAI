<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generic Car HMI Cluster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #091523;
      --bg-2: #031018;
      --panel: rgba(11, 22, 37, 0.88);
      --ring: #1f3f63;
      --accent: #2de2a8;
      --accent-2: #39b8ff;
      --warn: #ffb11c;
      --danger: #ff4d4d;
      --text: #dff5ff;
      --muted: #8eb8cb;
      --glass: rgba(196, 239, 255, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(57, 184, 255, 0.22), transparent 35%),
        radial-gradient(circle at 85% 18%, rgba(45, 226, 168, 0.18), transparent 30%),
        linear-gradient(150deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .cluster-shell {
      width: min(1100px, 95vw);
      padding: 18px;
      border-radius: 26px;
      border: 1px solid rgba(136, 214, 255, 0.2);
      background: linear-gradient(160deg, rgba(7, 16, 27, 0.88), rgba(6, 12, 22, 0.94));
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      isolation: isolate;
      animation: reveal 760ms ease-out;
    }

    .cluster-shell::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1px solid rgba(135, 225, 255, 0.1);
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px 14px;
      letter-spacing: 1px;
    }

    .header .title {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 700;
      text-transform: uppercase;
      color: #c9efff;
    }

    .header .time {
      font-family: "Orbitron", sans-serif;
      color: var(--muted);
      font-size: 14px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr minmax(240px, 0.9fr) 1fr;
      gap: 16px;
    }

    .dial-wrap,
    .center-panel {
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid rgba(130, 220, 255, 0.18);
      backdrop-filter: blur(6px);
    }

    .dial-wrap {
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .dial {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
    }

    .dial text {
      font-family: "Orbitron", sans-serif;
      fill: var(--muted);
      font-size: 8.5px;
    }

    .dial .label {
      font-size: 11px;
      fill: #d6f2ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .needle {
      transform-origin: 100px 100px;
      transition: transform 0.25s ease-out;
      filter: drop-shadow(0 0 5px rgba(57, 184, 255, 0.7));
    }

    .value-chip {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(16px, 2vw, 24px);
      color: #f3fbff;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(45, 226, 168, 0.45);
    }

    .center-panel {
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 12px;
    }

    .gear-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-family: "Orbitron", sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .gear {
      color: #88aebf;
      opacity: 0.7;
      transition: color 160ms ease, opacity 160ms ease, text-shadow 160ms ease;
    }

    .gear.active {
      color: var(--accent);
      opacity: 1;
      text-shadow: 0 0 18px rgba(45, 226, 168, 0.9);
    }

    .digital-speed {
      text-align: center;
      font-family: "Orbitron", sans-serif;
      border-radius: 14px;
      border: 1px solid rgba(130, 220, 255, 0.2);
      padding: 10px 8px;
      background: linear-gradient(180deg, rgba(9, 24, 39, 0.82), rgba(6, 15, 25, 0.82));
    }

    .digital-speed .num {
      display: block;
      font-size: clamp(36px, 8vw, 60px);
      line-height: 1;
      color: #f6fdff;
      text-shadow: 0 0 26px rgba(57, 184, 255, 0.6);
    }

    .digital-speed .unit {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .trip-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .trip-card {
      border-radius: 12px;
      border: 1px solid rgba(130, 220, 255, 0.16);
      padding: 8px;
      text-align: center;
      background: rgba(11, 24, 38, 0.7);
    }

    .trip-card .k {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .trip-card .v {
      font-family: "Orbitron", sans-serif;
      font-size: 20px;
      color: #eaf8ff;
    }

    .telltales {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px 8px;
      align-content: start;
      padding: 9px 8px;
      border-radius: 12px;
      border: 1px solid rgba(135, 218, 255, 0.1);
      background: radial-gradient(circle at 50% -60%, rgba(31, 71, 103, 0.3), rgba(5, 11, 18, 0.92));
    }

    .lamp {
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 4px;
      text-align: center;
      background: transparent;
      color: rgba(128, 154, 173, 0.2);
      min-height: 34px;
      display: grid;
      place-items: center;
      opacity: 0.45;
      cursor: default;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, color 180ms ease, opacity 180ms ease;
      font-size: 18px;
    }

    .lamp .icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
    }

    .icon-svg {
      width: 22px;
      height: 22px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lamp.active.warn {
      opacity: 1;
      color: #ffe6b3;
      border-color: rgba(255, 177, 28, 0.78);
      box-shadow: 0 0 22px rgba(255, 177, 28, 0.4);
      transform: translateY(-1px);
    }

    .lamp.active.danger {
      opacity: 1;
      color: #ffd5d5;
      border-color: rgba(255, 77, 77, 0.84);
      box-shadow: 0 0 22px rgba(255, 77, 77, 0.45);
      transform: translateY(-1px);
      animation: pulse 1.25s infinite;
    }

    .lamp.active.info {
      opacity: 1;
      color: #d0f4ff;
      border-color: rgba(57, 184, 255, 0.84);
      box-shadow: 0 0 22px rgba(57, 184, 255, 0.45);
      transform: translateY(-1px);
    }

    .lamp.active.tone-green {
      opacity: 1;
      color: #56ff9e;
      border-color: rgba(86, 255, 158, 0.85);
      box-shadow: 0 0 22px rgba(86, 255, 158, 0.42);
    }

    .lamp.active.tone-blue {
      opacity: 1;
      color: #57b6ff;
      border-color: rgba(87, 182, 255, 0.86);
      box-shadow: 0 0 22px rgba(87, 182, 255, 0.44);
    }

    .lamp.active.tone-amber {
      opacity: 1;
      color: #ffbf54;
      border-color: rgba(255, 191, 84, 0.85);
      box-shadow: 0 0 22px rgba(255, 191, 84, 0.42);
    }

    .lamp.active.tone-red {
      opacity: 1;
      color: #ff6262;
      border-color: rgba(255, 98, 98, 0.9);
      box-shadow: 0 0 22px rgba(255, 98, 98, 0.45);
    }

    .lamp.active.tone-white {
      opacity: 1;
      color: #f6fbff;
      border-color: rgba(224, 244, 255, 0.85);
      box-shadow: 0 0 22px rgba(224, 244, 255, 0.36);
    }

    .controls {
      margin-top: 14px;
      border-radius: 14px;
      border: 1px solid rgba(130, 220, 255, 0.18);
      background: rgba(8, 17, 29, 0.8);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .panel-title {
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #b9e8ff;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .telltale-control-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 8px;
    }

    .icon-toggle {
      border: 1px solid rgba(130, 220, 255, 0.2);
      border-radius: 8px;
      min-height: 40px;
      background: rgba(10, 22, 36, 0.9);
      color: #93b8cb;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
      transition: color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .icon-toggle .icon-svg {
      width: 20px;
      height: 20px;
    }

    .icon-toggle.active.info {
      color: #d0f4ff;
      border-color: rgba(57, 184, 255, 0.84);
      box-shadow: 0 0 18px rgba(57, 184, 255, 0.35);
      transform: translateY(-1px);
    }

    .icon-toggle.active.warn {
      color: #ffe6b3;
      border-color: rgba(255, 177, 28, 0.78);
      box-shadow: 0 0 18px rgba(255, 177, 28, 0.35);
      transform: translateY(-1px);
    }

    .icon-toggle.active.danger {
      color: #ffd5d5;
      border-color: rgba(255, 77, 77, 0.84);
      box-shadow: 0 0 18px rgba(255, 77, 77, 0.4);
      transform: translateY(-1px);
    }

    .icon-toggle.active.tone-green {
      color: #56ff9e;
      border-color: rgba(86, 255, 158, 0.86);
      box-shadow: 0 0 18px rgba(86, 255, 158, 0.4);
    }

    .icon-toggle.active.tone-blue {
      color: #57b6ff;
      border-color: rgba(87, 182, 255, 0.86);
      box-shadow: 0 0 18px rgba(87, 182, 255, 0.4);
    }

    .icon-toggle.active.tone-amber {
      color: #ffbf54;
      border-color: rgba(255, 191, 84, 0.86);
      box-shadow: 0 0 18px rgba(255, 191, 84, 0.4);
    }

    .icon-toggle.active.tone-red {
      color: #ff6262;
      border-color: rgba(255, 98, 98, 0.9);
      box-shadow: 0 0 18px rgba(255, 98, 98, 0.45);
    }

    .icon-toggle.active.tone-white {
      color: #f6fbff;
      border-color: rgba(224, 244, 255, 0.86);
      box-shadow: 0 0 18px rgba(224, 244, 255, 0.35);
    }

    .control-row {
      display: grid;
      grid-template-columns: 80px 1fr 52px;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-2);
    }

    button {
      border: 1px solid rgba(130, 220, 255, 0.3);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(16, 39, 62, 0.92), rgba(11, 26, 43, 0.92));
      color: #d8f4ff;
      font-family: "Orbitron", sans-serif;
      letter-spacing: 1px;
      padding: 10px 12px;
      cursor: pointer;
      transition: filter 140ms ease, transform 140ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.8px;
    }

    .arxml-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .file-input {
      width: 100%;
      border: 1px solid rgba(130, 220, 255, 0.26);
      border-radius: 8px;
      background: rgba(10, 22, 36, 0.9);
      color: var(--muted);
      padding: 7px;
      font-family: "Rajdhani", sans-serif;
    }

    .chip-btn {
      padding: 8px 10px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #arxmlStatus {
      border: 1px solid rgba(130, 220, 255, 0.18);
      border-radius: 10px;
      background: rgba(11, 24, 38, 0.62);
      padding: 8px;
      line-height: 1.3;
      min-height: 38px;
      color: #c6deeb;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    #arxmlStatus.status-error {
      color: #ffd5d5;
      border-color: rgba(255, 98, 98, 0.85);
      background: rgba(62, 12, 18, 0.72);
      box-shadow: 0 0 18px rgba(255, 98, 98, 0.18);
    }

    #arxmlStatus.status-success {
      color: #d8ffe8;
      border-color: rgba(86, 255, 158, 0.42);
      background: rgba(11, 42, 28, 0.58);
      box-shadow: 0 0 18px rgba(86, 255, 158, 0.12);
    }

    .alert-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 8, 14, 0.68);
      backdrop-filter: blur(4px);
      z-index: 9999;
      padding: 18px;
    }

    .alert-overlay.open {
      display: flex;
    }

    .alert-modal {
      width: min(460px, 92vw);
      border-radius: 18px;
      border: 1px solid rgba(255, 98, 98, 0.55);
      background: linear-gradient(180deg, rgba(44, 10, 14, 0.97), rgba(26, 8, 12, 0.98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 24px rgba(255, 98, 98, 0.18);
      padding: 18px;
    }

    .alert-title {
      font-family: "Orbitron", sans-serif;
      color: #ff8b8b;
      font-size: 14px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .alert-body {
      color: #ffe1e1;
      line-height: 1.45;
      font-size: 14px;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .alert-actions {
      display: flex;
      justify-content: flex-end;
    }

    .alert-close {
      min-width: 96px;
      border-color: rgba(255, 120, 120, 0.45);
      background: linear-gradient(180deg, rgba(92, 23, 31, 0.95), rgba(59, 12, 18, 0.95));
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 980px) {
      .main {
        grid-template-columns: 1fr;
      }
      .dial-wrap {
        max-width: 520px;
        justify-self: center;
        width: 100%;
      }
      .center-panel {
        order: -1;
      }
    }

    @media (max-width: 520px) {
      .cluster-shell {
        width: 98vw;
        padding: 12px;
      }
      .header {
        padding-bottom: 10px;
      }
      .trip-row {
        grid-template-columns: 1fr;
      }
      .telltales {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .telltale-control-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .controls {
        padding: 10px;
      }
      .control-row {
        grid-template-columns: 70px 1fr 44px;
      }
      .arxml-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;left:-9999px;overflow:hidden" aria-hidden="true" focusable="false">

  <section class="cluster-shell" aria-label="Generic car HMI cluster">
    <header class="header">
      <div class="title">Generic Digital Cluster</div>
      <div id="clock" class="time">--:--</div>
    </header>

    <div class="main">
      <article class="dial-wrap" aria-label="Speed gauge">
        <svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Speedometer">
          <defs>
            <linearGradient id="speedGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#39b8ff" />
              <stop offset="100%" stop-color="#2de2a8" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#17324f" stroke-width="8" />
          <path d="M26 140 A88 88 0 0 1 174 140" fill="none" stroke="url(#speedGrad)" stroke-width="10" stroke-linecap="round" />
          <g id="speedTicks"></g>
          <g id="speedNeedle" class="needle">
            <line x1="100" y1="100" x2="100" y2="34" stroke="#e9fbff" stroke-width="3.2" stroke-linecap="round" />
            <circle cx="100" cy="100" r="5.5" fill="#d8f7ff" />
          </g>
          <text class="label" x="100" y="126" text-anchor="middle">SPEED</text>
          <text x="100" y="140" text-anchor="middle">km/h</text>
        </svg>
        <div id="speedChip" class="value-chip">0 km/h</div>
      </article>

      <article class="center-panel" aria-label="Center info">
        <div class="gear-row" aria-label="Gear indicator">
          <span class="gear">P</span>
          <span class="gear">R</span>
          <span class="gear">N</span>
          <span class="gear active">D</span>
        </div>

        <div class="digital-speed" aria-label="Digital speed display">
          <span id="digitalSpeed" class="num">000</span>
          <span class="unit">KM/H</span>
        </div>

        <div class="trip-row">
          <div class="trip-card">
            <div class="k">Range</div>
            <div id="rangeVal" class="v">420 km</div>
          </div>
          <div class="trip-card">
            <div class="k">Fuel</div>
            <div id="fuelVal" class="v">68%</div>
          </div>
        </div>

        <div class="telltales" aria-label="Warning and status lamps">
          <div class="lamp tone-red" data-lamp="aeb" data-level="danger" title="AEB warning"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-aeb"></use></svg></div></div>
          <div class="lamp tone-green" data-lamp="left" data-level="info" title="Left turn"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-left"></use></svg></div></div>
          <div class="lamp tone-blue" data-lamp="highbeam" data-level="info" title="High beam"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-highbeam"></use></svg></div></div>
          <div class="lamp tone-green" data-lamp="right" data-level="info" title="Right turn"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-right"></use></svg></div></div>
          <div class="lamp tone-red" data-lamp="seatbelt" data-level="danger" title="Seat belt"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-seatbelt"></use></svg></div></div>
          <div class="lamp tone-amber" data-lamp="engine" data-level="warn" title="Check engine"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-engine"></use></svg></div></div>

          <div class="lamp tone-red" data-lamp="battery" data-level="danger" title="Battery"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-battery"></use></svg></div></div>
          <div class="lamp tone-red" data-lamp="oil" data-level="danger" title="Oil pressure"><div class="icon"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-oil"></use></svg></div></div>

        </div>

      <article class="dial-wrap" aria-label="RPM gauge">
        <svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Tachometer">
          <defs>
            <linearGradient id="rpmGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#39b8ff" />
              <stop offset="75%" stop-color="#ffb11c" />
              <stop offset="100%" stop-color="#ff4d4d" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#17324f" stroke-width="8" />
          <path d="M26 140 A88 88 0 0 1 174 140" fill="none" stroke="url(#rpmGrad)" stroke-width="10" stroke-linecap="round" />
          <g id="rpmTicks"></g>
          <g id="rpmNeedle" class="needle">
            <line x1="100" y1="100" x2="100" y2="34" stroke="#e9fbff" stroke-width="3.2" stroke-linecap="round" />
            <circle cx="100" cy="100" r="5.5" fill="#d8f7ff" />
          </g>

    <section class="controls" aria-label="Cluster controls">
      <div class="panel-title">Vehicle Controls</div>
      <div class="control-row">
        <span>Speed</span>
        <input id="speedSlider" type="range" min="0" max="240" value="0" />
        <span id="speedOut">0</span>
      </div>
      <div class="control-row">
        <span>RPM</span>
        <input id="rpmSlider" type="range" min="0" max="8000" value="900" />
        <span id="rpmOut">900</span>
      </div>
      <button id="demoBtn" type="button">Start Demo Drive</button>
      <div class="panel-title">Telltale Control Panel</div>
      <div class="telltale-control-grid" aria-label="Icon telltale controls">
        <button type="button" class="icon-toggle tone-red" data-target="aeb" title="AEB warning"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-aeb"></use></svg></button>
        <button type="button" class="icon-toggle tone-green" data-target="left" title="Left turn"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-left"></use></svg></button>
        <button type="button" class="icon-toggle tone-blue" data-target="highbeam" title="High beam"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-highbeam"></use></svg></button>
        <button type="button" class="icon-toggle tone-green" data-target="right" title="Right turn"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-right"></use></svg></button>
        <button type="button" class="icon-toggle tone-red" data-target="seatbelt" title="Seat belt"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-seatbelt"></use></svg></button>
        <button type="button" class="icon-toggle tone-amber" data-target="engine" title="Check engine"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-engine"></use></svg></button>
        <button type="button" class="icon-toggle tone-red" data-target="abs" title="ABS"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-abs"></use></svg></button>
        <button type="button" class="icon-toggle tone-red" data-target="battery" title="Battery"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-battery"></use></svg></button>
        <button type="button" class="icon-toggle tone-red" data-target="oil" title="Oil pressure"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-oil"></use></svg></button>
        <button type="button" class="icon-toggle tone-red" data-target="door" title="Door open"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#tt-door"></use></svg></button>
      </div>
      <div class="status">Icon panel below now controls the telltales shown in the center cluster.</div>

      <div class="panel-title">ARXML</div>
      <div class="arxml-row">
        <input id="arxmlFile" class="file-input" type="file" accept=".arxml,.xml" />
        <button id="simulateSampleBtn" type="button" class="chip-btn">Run Embedded EBS</button>
        <button id="simulateFileBtn" type="button" class="chip-btn">Simulate File</button>
      </div>
      <div id="arxmlStatus" class="status">Embedded AEBSystem ARXML is ready. Click Run Embedded EBS.</div>
    </section>
  </section>

  <div id="alertOverlay" class="alert-overlay" aria-hidden="true">
    <div class="alert-modal" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertBody">
      <div id="alertTitle" class="alert-title">ARXML Warning</div>
      <div id="alertBody" class="alert-body"></div>
      <div class="alert-actions">
        <button id="alertCloseBtn" type="button" class="alert-close">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    const speedNeedle = document.getElementById("speedNeedle");
    const rpmNeedle = document.getElementById("rpmNeedle");
    const speedSlider = document.getElementById("speedSlider");
    const rpmSlider = document.getElementById("rpmSlider");
    const speedOut = document.getElementById("speedOut");
    const rpmOut = document.getElementById("rpmOut");
    const speedChip = document.getElementById("speedChip");
    const rpmChip = document.getElementById("rpmChip");
    const digitalSpeed = document.getElementById("digitalSpeed");
    const rangeVal = document.getElementById("rangeVal");
    const fuelVal = document.getElementById("fuelVal");
    const demoBtn = document.getElementById("demoBtn");
    const clock = document.getElementById("clock");
    const lamps = Array.from(document.querySelectorAll(".lamp"));
    const iconToggles = Array.from(document.querySelectorAll(".icon-toggle"));
    const arxmlFileInput = document.getElementById("arxmlFile");
    const simulateSampleBtn = document.getElementById("simulateSampleBtn");
    const simulateFileBtn = document.getElementById("simulateFileBtn");
    const arxmlStatus = document.getElementById("arxmlStatus");
    const alertOverlay = document.getElementById("alertOverlay");
    const alertBody = document.getElementById("alertBody");
    const alertCloseBtn = document.getElementById("alertCloseBtn");

    const SAMPLE_ARXML = `<?xml version="1.0" encoding="UTF-8"?>
<AUTOSAR>
  <SYSTEM>
    <SHORT-NAME>AEBSystem</SHORT-NAME>
    <DESCRIPTION>Emergency Braking System</DESCRIPTION>
  </SYSTEM>
  <ECUS>
    <ECU>
      <SHORT-NAME>Controller</SHORT-NAME>
      <PROCESSOR>Automotive_MCU</PROCESSOR>
      <SAFETY-CLASS>QM</SAFETY-CLASS>
    </ECU>
    <ECU>
      <SHORT-NAME>SensorNode</SHORT-NAME>
      <PROCESSOR>Automotive_MCU</PROCESSOR>
      <SAFETY-CLASS>QM</SAFETY-CLASS>
    </ECU>
  </ECUS>
  <SERVICES>
    <SERVICE>
      <SHORT-NAME>EmergencyBrakingService</SHORT-NAME>
      <ROUTE>/brakecontrol/service</ROUTE>
      <PROTOCOL>SOME/IP</PROTOCOL>
    </SERVICE>
    <SERVICE>
      <SHORT-NAME>SensorDataInterface</SHORT-NAME>
      <ROUTE>/brakecontrol/service</ROUTE>
      <PROTOCOL>SOME/IP</PROTOCOL>
    </SERVICE>
  </SERVICES>
  <SIGNALS>
    <SIGNAL>
      <SHORT-NAME>EBRequest</SHORT-NAME>
      <SOURCE />
      <DESTINATION />
      <FORMAT>CAN</FORMAT>
    </SIGNAL>
    <SIGNAL>
      <SHORT-NAME>ACCel</SHORT-NAME>
      <SOURCE />
      <DESTINATION />
      <FORMAT>ETHERNET</FORMAT>
    </SIGNAL>
  </SIGNALS>
  <SAFETY>
    <CHECK>REDUNDANCY</CHECK>
    <CHECK>WATCHDOG</CHECK>
  </SAFETY>
</AUTOSAR>`;

    let demoTimer = null;
    let arxmlTimer = null;
    let loadedArxmlSpec = null;
    let authorizedLampIds = new Set();

    function showAlert(message) {
      alertBody.textContent = message;
      alertOverlay.classList.add("open");
      alertOverlay.setAttribute("aria-hidden", "false");
    }

    function hideAlert() {
      alertOverlay.classList.remove("open");
      alertOverlay.setAttribute("aria-hidden", "true");
    }

    function setArxmlStatus(message, tone = "neutral") {
      arxmlStatus.textContent = message;
      arxmlStatus.classList.remove("status-error", "status-success");
      if (tone === "error") {
        arxmlStatus.classList.add("status-error");
        showAlert(message);
      } else if (tone === "success") {
        arxmlStatus.classList.add("status-success");
      }
    }

    function setAuthorizedLampIds(stateMap) {
      authorizedLampIds = new Set(
        Object.entries(stateMap)
          .filter(([, isOn]) => Boolean(isOn))
          .map(([lampId]) => lampId)
      );
    }

    function requireAuthorizedLampControl(lampId) {
      if (!loadedArxmlSpec) {
        setArxmlStatus(
          "Load a valid ARXML first. The telltale control panel only drives cluster indicators authorized by the loaded ARXML.",
          "error"
        );
        return false;
      }
      if (!authorizedLampIds.has(lampId)) {
        setArxmlStatus(
          `Loaded ARXML does not authorize the ${lampId.toUpperCase()} telltale for cluster control.`,
          "error"
        );
        return false;
      }
      return true;
    }

    function buildTicks(containerId, maxVal, step, unitStep) {
      const group = document.getElementById(containerId);
      const startDeg = -130;
      const spanDeg = 260;
      for (let v = 0; v <= maxVal; v += step) {
        const ratio = v / maxVal;
        const deg = startDeg + ratio * spanDeg;
        const rad = (deg * Math.PI) / 180;

        const major = v % unitStep === 0;
        const r1 = major ? 65 : 70;
        const r2 = 80;

        const x1 = 100 + r1 * Math.cos(rad);
        const y1 = 100 + r1 * Math.sin(rad);
        const x2 = 100 + r2 * Math.cos(rad);
        const y2 = 100 + r2 * Math.sin(rad);

        const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
        tick.setAttribute("x1", x1.toFixed(2));
        tick.setAttribute("y1", y1.toFixed(2));
        tick.setAttribute("x2", x2.toFixed(2));
        tick.setAttribute("y2", y2.toFixed(2));
        tick.setAttribute("stroke", major ? "#c4efff" : "#4d7696");
        tick.setAttribute("stroke-width", major ? "2" : "1");
        tick.setAttribute("stroke-linecap", "round");
        group.appendChild(tick);

        if (major) {
          const tx = 100 + 54 * Math.cos(rad);
          const ty = 100 + 54 * Math.sin(rad) + 3;
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", tx.toFixed(2));
          label.setAttribute("y", ty.toFixed(2));
          label.setAttribute("text-anchor", "middle");
          label.textContent = String(v / unitStep);
          group.appendChild(label);
        }
      }
    }

    function valueToDegree(value, min, max) {
      const clamped = Math.min(max, Math.max(min, Number(value)));
      const ratio = (clamped - min) / (max - min);
      return -130 + ratio * 260;
    }

    function updateCluster(speed, rpm) {
      const speedDeg = valueToDegree(speed, 0, 240);
      const rpmDeg = valueToDegree(rpm, 0, 8000);

      speedNeedle.style.transform = `rotate(${speedDeg}deg)`;
      rpmNeedle.style.transform = `rotate(${rpmDeg}deg)`;

      speedOut.textContent = String(Math.round(speed));
      rpmOut.textContent = String(Math.round(rpm));
      speedChip.textContent = `${Math.round(speed)} km/h`;
      rpmChip.textContent = `${(rpm / 1000).toFixed(1)} x1000`;
      digitalSpeed.textContent = String(Math.round(speed)).padStart(3, "0");

      const fuel = Math.max(8, 78 - speed * 0.16 - rpm * 0.0012);
      const range = Math.max(40, Math.round(fuel * 6.2));
      fuelVal.textContent = `${Math.round(fuel)}%`;
      rangeVal.textContent = `${range} km`;

      const gears = document.querySelectorAll(".gear");
      gears.forEach((g) => g.classList.remove("active"));
      const gearIndex = speed < 2 ? 0 : speed < 20 ? 3 : speed < 45 ? 3 : speed < 75 ? 3 : 3;
      gears[gearIndex].classList.add("active");
    }

    function syncFromInputs() {
      updateCluster(Number(speedSlider.value), Number(rpmSlider.value));
    }

    function applyToggleState(lampId, forceState) {
      const lamp = document.querySelector(`.lamp[data-lamp="${lampId}"]`);
      if (!lamp) {
        return;
      }

      const shouldBeActive = typeof forceState === "boolean" ? forceState : !lamp.classList.contains("active");
      lamp.classList.toggle("active", shouldBeActive);

      const button = document.querySelector(`.icon-toggle[data-target="${lampId}"]`);
      if (button) {
        button.classList.toggle("active", shouldBeActive);
      }
    }

    function syncToggleButtonsFromLamps() {
      lamps.forEach((lamp) => {
        const lampId = lamp.dataset.lamp;
        const button = document.querySelector(`.icon-toggle[data-target="${lampId}"]`);
        if (!button) {
          return;
        }
        button.classList.toggle("active", lamp.classList.contains("active"));
      });
    }

    function setLampStates(stateMap) {
      Object.entries(stateMap).forEach(([lampId, isOn]) => {
        applyToggleState(lampId, Boolean(isOn));
      });
    }

    function parseArxmlSpec(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, "application/xml");
      if (doc.querySelector("parsererror")) {
        throw new Error("Invalid ARXML/XML format");
      }

      const firstText = (selector) => (doc.querySelector(selector)?.textContent || "").trim();
      const listText = (selector) =>
        Array.from(doc.querySelectorAll(selector))
          .map((n) => (n.textContent || "").trim())
          .filter(Boolean);

      const systemName = firstText("SYSTEM > SHORT-NAME") || "UnnamedSystem";
      const description = firstText("SYSTEM > DESCRIPTION");
      const services = listText("SERVICES > SERVICE > SHORT-NAME");
      const serviceProtocols = listText("SERVICES > SERVICE > PROTOCOL");
      const signals = listText("SIGNALS > SIGNAL > SHORT-NAME");
      const safetyChecks = listText("SAFETY > CHECK");

      const signalFormats = listText("SIGNALS > SIGNAL > FORMAT");
      const signalSources = listText("SIGNALS > SIGNAL > SOURCE");
      const signalDestinations = listText("SIGNALS > SIGNAL > DESTINATION");

      const transportTokens = [
        ...serviceProtocols,
        ...signalFormats,
        ...signalSources,
        ...signalDestinations,
      ]
        .join(" ")
        .toLowerCase();

      const hasSomeIp = transportTokens.includes("some/ip") || transportTokens.includes("someip");
      const hasCan = transportTokens.includes("can");
      const hasEthernet = transportTokens.includes("ethernet") || transportTokens.includes("eth");

      // Accepted transport patterns:
      // 1) SOME/IP only
      // 2) CAN + Ethernet (gateway/bridge style)
      // 3) CAN + SOME/IP (gateway/bridge style)
      const isSomeIpOnly = hasSomeIp && !hasCan && !hasEthernet;
      const isCanEthernetCombo = hasCan && hasEthernet;
      const isCanSomeIpCombo = hasCan && hasSomeIp;

      if (!(isSomeIpOnly || isCanEthernetCombo || isCanSomeIpCombo)) {
        const detected = [
          hasSomeIp ? "SOME/IP" : null,
          hasCan ? "CAN" : null,
          hasEthernet ? "ETHERNET" : null,
        ].filter(Boolean);
        const detectedText = detected.length ? detected.join(" + ") : "none";
        throw new Error(
          `Signal transport validation failed: expected SOME/IP-only, CAN+ETHERNET, or SOME/IP+CAN, detected ${detectedText}`
        );
      }

      return {
        systemName,
        description,
        services,
        signals,
        safetyChecks,
        transportProfile: isSomeIpOnly
          ? "SOME/IP only"
          : isCanEthernetCombo
            ? "CAN + ETHERNET"
            : "SOME/IP + CAN",
      };
    }

    function hasKeyword(items, keywords) {
      const haystack = (items || []).join(" ").toLowerCase();
      return keywords.some((k) => haystack.includes(k));
    }

    function deriveLampStatesFromSpec(spec) {
      const contextItems = [
        spec.systemName,
        spec.description,
        ...(spec.services || []),
        ...(spec.signals || []),
        ...(spec.safetyChecks || []),
        spec.transportProfile || "",
      ].filter(Boolean);

      return {
        aeb: hasKeyword(contextItems, ["aeb", "emergency braking", "ebr", "brake", "collision"]),
        left: hasKeyword(contextItems, ["left indicator", "left turn", "turn-left", "turn left"]),
        right: hasKeyword(contextItems, ["right indicator", "right turn", "turn-right", "turn right"]),
        highbeam: hasKeyword(contextItems, ["highbeam", "high beam", "headlamp", "lighting"]),
        seatbelt: hasKeyword(contextItems, ["seatbelt", "seat belt", "occupant", "restraint"]),
        engine: hasKeyword(contextItems, ["engine", "watchdog", "powertrain", "ecu fault"]),
        abs: hasKeyword(contextItems, ["abs", "redundancy", "stability", "brake"]),
        battery: hasKeyword(contextItems, ["battery", "voltage", "power supply", "alternator"]),
        oil: hasKeyword(contextItems, ["oil", "lubrication", "pressure"]),
        door: hasKeyword(contextItems, ["door", "door open", "entry"]),
      };
    }

    function activeLampList(stateMap) {
      return Object.entries(stateMap)
        .filter(([, isOn]) => Boolean(isOn))
        .map(([lampId]) => lampId.toUpperCase());
    }

    function resetAllLamps() {
      setLampStates({
        aeb: false,
        left: false,
        right: false,
        highbeam: false,
        seatbelt: false,
        engine: false,
        abs: false,
        battery: false,
        oil: false,
        door: false,
      });
    }

    function runArxmlSimulation(spec) {
      if (demoTimer) {
        clearInterval(demoTimer);
        demoTimer = null;
        demoBtn.textContent = "Start Demo Drive";
      }
      if (arxmlTimer) {
        clearInterval(arxmlTimer);
        arxmlTimer = null;
      }

      const brakeScenario =
        hasKeyword([spec.systemName, spec.description, ...spec.services, ...spec.signals], ["aeb", "brake", "ebr", "ebrequest"]);
      const safetyRedundancy = hasKeyword(spec.safetyChecks, ["redundancy"]);
      const safetyWatchdog = hasKeyword(spec.safetyChecks, ["watchdog"]);
      const derivedLampStates = deriveLampStatesFromSpec(spec);

      const startSpeed = brakeScenario ? 96 : 64;
      const endSpeed = brakeScenario ? 8 : 52;
      const startRpm = brakeScenario ? 3000 : 2100;
      const endRpm = brakeScenario ? 950 : 1700;

      const authorizedLamps = {
        aeb: derivedLampStates.aeb || brakeScenario,
        left: derivedLampStates.left,
        right: derivedLampStates.right,
        highbeam: derivedLampStates.highbeam,
        seatbelt: derivedLampStates.seatbelt,
        engine: derivedLampStates.engine || safetyWatchdog,
        abs: derivedLampStates.abs || brakeScenario || safetyRedundancy,
        battery: derivedLampStates.battery,
        oil: derivedLampStates.oil,
        door: derivedLampStates.door,
      };
      const activeLamps = activeLampList(authorizedLamps);
      loadedArxmlSpec = spec;
      setAuthorizedLampIds(authorizedLamps);
      resetAllLamps();

      speedSlider.value = String(startSpeed);
      rpmSlider.value = String(startRpm);
      syncFromInputs();

      setArxmlStatus(
        `Loaded ${spec.systemName} | Transport: ${spec.transportProfile} | Authorized telltales: ${activeLamps.join(", ") || "none"} | Services: ${spec.services.length} | Signals: ${spec.signals.length} | Safety checks: ${spec.safetyChecks.join(", ") || "none"}`,
        "success"
      );
    }

    function simulateArxmlText(xmlText, sourceLabel) {
      try {
        const spec = parseArxmlSpec(xmlText);
        runArxmlSimulation(spec);
      } catch (err) {
        loadedArxmlSpec = null;
        authorizedLampIds = new Set();
        setArxmlStatus(`Failed to parse ${sourceLabel}: ${err.message || err}`, "error");
      }
    }

    function toggleDemo() {
      if (demoTimer) {
        clearInterval(demoTimer);
        demoTimer = null;
        demoBtn.textContent = "Start Demo Drive";
        return;
      }

      demoBtn.textContent = "Stop Demo Drive";
      let t = 0;
      demoTimer = setInterval(() => {
        t += 0.08;
        const speed = 70 + 60 * Math.sin(t) + 20 * Math.sin(t * 0.5);
        const rpm = 1800 + 1300 * Math.sin(t * 1.2) + 800 * Math.sin(t * 0.4);
        speedSlider.value = Math.max(0, Math.min(240, speed)).toFixed(0);
        rpmSlider.value = Math.max(700, Math.min(7600, rpm)).toFixed(0);
        syncFromInputs();
      }, 90);
    }

    function startClock() {
      function tick() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        clock.textContent = `${hh}:${mm}`;
      }
      tick();
      setInterval(tick, 1000);
    }

    buildTicks("speedTicks", 240, 10, 20);
    buildTicks("rpmTicks", 8000, 500, 1000);

    speedSlider.addEventListener("input", syncFromInputs);
    rpmSlider.addEventListener("input", syncFromInputs);
    demoBtn.addEventListener("click", toggleDemo);

    iconToggles.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!requireAuthorizedLampControl(btn.dataset.target)) {
          return;
        }
        applyToggleState(btn.dataset.target);
      });
    });

    simulateSampleBtn.addEventListener("click", () => {
      simulateArxmlText(SAMPLE_ARXML, "embedded Emergency Braking ARXML");
    });

    simulateFileBtn.addEventListener("click", () => {
      const file = arxmlFileInput.files && arxmlFileInput.files[0];
      if (!file) {
        setArxmlStatus("Choose an .arxml file first, then press Simulate File.", "error");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        simulateArxmlText(String(reader.result || ""), file.name);
      };
      reader.onerror = () => {
        setArxmlStatus(`Could not read file: ${file.name}`, "error");
      };
      reader.readAsText(file);
    });

    alertCloseBtn.addEventListener("click", hideAlert);
    alertOverlay.addEventListener("click", (event) => {
      if (event.target === alertOverlay) {
        hideAlert();
      }
    });

    startClock();
    syncFromInputs();
